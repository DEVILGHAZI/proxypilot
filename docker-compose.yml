services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proxypilot
      POSTGRES_PASSWORD: proxypilot
      POSTGRES_DB: proxypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxypilot -d proxypilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxypilot:proxypilot@postgres:5432/proxypilot
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://proxypilot:proxypilot@postgres:5432/proxypilot
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_BASE_URL: http://api:4000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
